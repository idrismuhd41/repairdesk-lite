<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — RepairDesk Lite</title>
  <style>
    :root {
      --blue-900: #0f2c4d;
      --blue-700: #1a4d80;
      --blue-500: #2e7dd1;
      --blue-100: #e6f0fa;
      --blue-50:  #f5f9fd;
      --gray-900: #1a202c;
      --gray-600: #4a5568;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--blue-50) 0%, var(--blue-100) 100%);
      color: var(--gray-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(15, 44, 77, 0.15);
      max-width: 480px;
      width: 100%;
      padding: 48px 32px;
      text-align: center;
    }
    .emoji {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: var(--blue-900);
      letter-spacing: -0.5px;
    }
    p {
      margin: 0 0 24px;
      color: var(--gray-600);
      font-size: 15px;
      line-height: 1.5;
    }
    .code {
      display: inline-block;
      background: var(--blue-100);
      color: var(--blue-700);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 24px;
      background: var(--blue-500);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: var(--blue-700);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🔧</div>
    <div class="code">404</div>
    <h1>Oops! Page not found</h1>
    <p>
      Looks like this tool went missing from the toolbox.
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn">Back to the board</a>
  </div>
</body>
</html>
